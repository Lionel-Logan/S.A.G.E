version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FACE_RECOGNITION_URL=http://facial-recognition:8002
      - OBJECT_DETECTION_URL=http://object-detection:8003
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service_account.json
    volumes:
      - ./service_account.json:/app/service_account.json
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - sage-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - sage-network

networks:
  sage-network:
    external: true
