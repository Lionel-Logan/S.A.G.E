version: '3.8'

services:
  facial-recognition:
    build: .
    ports:
      - "8002:8002"
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      - DEBUG=False
    volumes:
      - ./src/data:/app/src/data
    restart: unless-stopped
    networks:
      - sage-network

networks:
  sage-network:
    external: true
